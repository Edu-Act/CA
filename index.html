<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Concept Analyzer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 15vh;
      min-height: 100vh;
      background-color: #9e9e9e;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .login-container {
      background: #ffffff;
      border-radius: 12px;
      padding: 40px 36px 36px;
      width: 380px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      text-align: center;
    }

    .login-container h1 {
      font-size: 22px;
      font-weight: 700;
      color: #333;
      margin-bottom: 28px;
      letter-spacing: 1px;
    }

    .login-container input[type="text"],
    .login-container input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 14px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      background-color: #eef2f7;
      color: #555;
      outline: none;
      transition: border-color 0.2s;
    }

    .login-container input[type="text"]:focus,
    .login-container input[type="password"]:focus {
      border-color: #5b9bd5;
    }

    .login-container input[type="text"]::placeholder,
    .login-container input[type="password"]::placeholder {
      color: #999;
    }

    /* ── Login Button / Progress Bar ── */
    .btn-login-wrap {
      position: relative;
      width: 100%;
      margin-top: 6px;
      height: 44px;
      border-radius: 6px;
      overflow: hidden;
      background: #4a7cdf;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn-login-wrap:hover { background: #3a65c0; }
    .btn-login-wrap.disabled { background: #a0b4d9; cursor: not-allowed; pointer-events: none; }

    .btn-login-wrap .progress-fill {
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: 0%;
      background: rgba(255,255,255,0.25);
      transition: width 0.3s ease;
      border-radius: 6px 0 0 6px;
    }

    .btn-login-wrap .btn-label {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      user-select: none;
    }

    .message {
      margin-top: 14px;
      font-size: 13px;
      color: #d9534f;
      min-height: 20px;
    }

    /* ── Loading Steps ── */
    .loading-section {
      display: none;
      margin-top: 20px;
      text-align: left;
      border-top: 1px solid #eee;
      padding-top: 16px;
    }
    .loading-section.show { display: block; }

    .step-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 0;
      font-size: 13px;
      color: #888;
      transition: color 0.2s;
    }
    .step-item.active { color: #333; font-weight: 500; }
    .step-item.done { color: #2e7d32; }
    .step-item.error { color: #d9534f; }

    .step-icon {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 13px;
    }

    .step-icon .spinner {
      width: 16px; height: 16px;
      border: 2px solid #ddd;
      border-top-color: #4a7cdf;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .step-icon .check { color: #2e7d32; font-weight: 900; font-size: 15px; }
    .step-icon .cross { color: #d9534f; font-weight: 900; font-size: 15px; }
    .step-icon .wait { color: #ccc; font-size: 10px; }

    .countdown-text {
      margin-top: 14px;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      color: #4a7cdf;
    }
  </style>
</head>
<body>
  <div class="login-container" id="loginContainer">
    <div style="display:flex; align-items:baseline; justify-content:center; gap:8px; margin-bottom:20px;">
      <h1 style="margin:0;">Concept Analyzer</h1>
      <a href="#" onclick="openRelatePopup(); return false;" style="display:inline-block; padding:0; width:24px; height:24px; display:inline-flex; align-items:center; justify-content:center; background:transparent; color:#999; border:1.5px solid #ccc; border-radius:4px; font-size:13px; font-weight:700; text-decoration:none; transition:all 0.2s; line-height:1;" onmouseover="this.style.borderColor='#999';this.style.color='#666'" onmouseout="this.style.borderColor='#ccc';this.style.color='#999'">@</a>
    </div>
    <!-- 브라우저 자동완성 트랩 (숨김 필드) -->
    <input type="text" name="fake_user" style="display:none" aria-hidden="true" />
    <input type="password" name="fake_pass" style="display:none" aria-hidden="true" />
    <input type="text" id="email" placeholder="E-mail" autocomplete="new-password" />
    <input type="password" id="password" placeholder="Password" autocomplete="new-password" />

    <div class="btn-login-wrap" id="loginBtn" onclick="handleLogin()">
      <div class="progress-fill" id="progressFill"></div>
      <div class="btn-label" id="btnLabel">Login</div>
    </div>

    <div class="message" id="msg"></div>

    <!-- 로딩 단계 표시 영역 -->
    <div class="loading-section" id="loadingSection">
      <div class="step-item" id="step1">
        <div class="step-icon" id="step1Icon"><span class="wait">●</span></div>
        <span>사용자 인증 확인 중...</span>
      </div>
      <div class="step-item" id="step2">
        <div class="step-icon" id="step2Icon"><span class="wait">●</span></div>
        <span>분석 데이터 서버에 연결 중...</span>
      </div>
      <div class="step-item" id="step3">
        <div class="step-icon" id="step3Icon"><span class="wait">●</span></div>
        <span>전체 분석 데이터 로딩 중...</span>
      </div>
      <div class="step-item" id="step4">
        <div class="step-icon" id="step4Icon"><span class="wait">●</span></div>
        <span>데이터 캐시 저장 중...</span>
      </div>
      <div class="step-item" id="step5">
        <div class="step-icon" id="step5Icon"><span class="wait">●</span></div>
        <span>분석 환경 준비 완료</span>
      </div>
      <div class="step-item" id="step6">
        <div class="step-icon" id="step6Icon"><span class="wait">●</span></div>
        <span id="step6Text">분석 페이지로 이동 중...</span>
      </div>
    </div>
  </div>

  <script>
    function openRelatePopup() {
      var w = Math.round(screen.width * 0.605);
      var h = Math.round(screen.height * 0.605);
      var left = Math.round((screen.width - w) / 2);
      var top = Math.round((screen.height - h) / 2);
      window.open('relate_article.html', 'relateArticle', 'width=' + w + ',height=' + h + ',left=' + left + ',top=' + top + ',scrollbars=yes,resizable=yes');
    }

    const GAS_URL = 'https://script.google.com/macros/s/AKfycbyp-bsk9zVmknsYf4ZKcHyyW8u8atb1CVLcLzv_MqdxzEY8PY_CDy4jt-cb8SyLiudI/exec';
    const DATA_GAS_URL = 'https://script.google.com/macros/s/AKfycbymfrHvJsVThc7RtoAOjn8ZOLkoJdMb1CVcfUQJm4fvY53a9FxOCBhJek-4Xl6YN0lcDg/exec';

    let isProcessing = false;

    function setProgress(pct) {
      document.getElementById('progressFill').style.width = pct + '%';
    }

    function setStepState(stepNum, state) {
      // state: 'wait', 'active', 'done', 'error'
      var item = document.getElementById('step' + stepNum);
      var icon = document.getElementById('step' + stepNum + 'Icon');
      item.className = 'step-item';
      if (state === 'active') {
        item.classList.add('active');
        icon.innerHTML = '<div class="spinner"></div>';
      } else if (state === 'done') {
        item.classList.add('done');
        icon.innerHTML = '<span class="check">✓</span>';
      } else if (state === 'error') {
        item.classList.add('error');
        icon.innerHTML = '<span class="cross">✕</span>';
      } else {
        icon.innerHTML = '<span class="wait">●</span>';
      }
    }

    function sleep(ms) {
      return new Promise(function(r) { setTimeout(r, ms); });
    }

    async function handleLogin() {
      if (isProcessing) return;

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const msg = document.getElementById('msg');
      const btnWrap = document.getElementById('loginBtn');
      const btnLabel = document.getElementById('btnLabel');
      const loadingSection = document.getElementById('loadingSection');

      if (!email || !password) {
        msg.textContent = '이메일과 비밀번호를 입력해주세요.';
        return;
      }

      msg.textContent = '';
      isProcessing = true;
      btnWrap.classList.add('disabled');
      btnLabel.textContent = '인증 중...';
      setProgress(10);

      // 로딩 섹션 표시
      loadingSection.classList.add('show');

      // Step 1: 사용자 인증
      setStepState(1, 'active');

      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ email, password })
        });

        const result = await response.json();

        if (!result.success) {
          setStepState(1, 'error');
          msg.style.color = '#d9534f';
          msg.textContent = result.message || '이메일 또는 비밀번호가 올바르지 않습니다.';
          btnLabel.textContent = 'Login';
          btnWrap.classList.remove('disabled');
          setProgress(0);
          isProcessing = false;
          // 2초 후 에러 단계 숨기기
          setTimeout(function() {
            loadingSection.classList.remove('show');
            resetSteps();
          }, 2000);
          return;
        }

        // 인증 성공
        setStepState(1, 'done');
        setProgress(25);
        btnLabel.textContent = '데이터 로딩 중...';
        sessionStorage.setItem('userEmail', email);

        await sleep(300);

        // Step 2: 데이터 서버 연결
        setStepState(2, 'active');
        setProgress(35);
        await sleep(400);
        setStepState(2, 'done');
        setProgress(45);

        // Step 3: 전체 데이터 로딩
        setStepState(3, 'active');
        btnLabel.textContent = '분석 데이터 로딩 중...';

        const dataResponse = await fetch(DATA_GAS_URL + '?action=getAllData');
        const dataResult = await dataResponse.json();

        if (!dataResult.success || !dataResult.rows || dataResult.rows.length === 0) {
          setStepState(3, 'error');
          msg.style.color = '#d9534f';
          msg.textContent = '분석 데이터를 불러올 수 없습니다.';
          btnLabel.textContent = 'Login';
          btnWrap.classList.remove('disabled');
          setProgress(0);
          isProcessing = false;
          return;
        }

        setStepState(3, 'done');
        setProgress(70);

        await sleep(300);

        // Step 4: 캐시 저장
        setStepState(4, 'active');
        btnLabel.textContent = '캐시 저장 중...';

        // sessionStorage에 데이터 저장
        try {
          sessionStorage.setItem('allRowsCache', JSON.stringify(dataResult.rows));
          sessionStorage.setItem('dataLoaded', 'true');
        } catch (storageErr) {
          // 용량 초과 시 localStorage 시도
          try {
            localStorage.setItem('allRowsCache', JSON.stringify(dataResult.rows));
            localStorage.setItem('dataLoaded', 'true');
            sessionStorage.setItem('dataStorageType', 'local');
          } catch (e2) {
            setStepState(4, 'error');
            msg.style.color = '#d9534f';
            msg.textContent = '데이터 캐시 저장 실패. 브라우저 저장소 용량이 부족합니다.';
            btnLabel.textContent = 'Login';
            btnWrap.classList.remove('disabled');
            setProgress(0);
            isProcessing = false;
            return;
          }
        }

        setStepState(4, 'done');
        setProgress(90);

        await sleep(300);

        // Step 5: 준비 완료
        setStepState(5, 'done');
        setProgress(95);
        btnLabel.textContent = '준비 완료!';

        await sleep(400);

        // Step 6: 카운트다운 (2초)
        setStepState(6, 'active');
        setProgress(100);
        var remaining = 2;
        document.getElementById('step6Text').textContent = remaining + '초 후 분석 페이지로 이동합니다.';
        btnLabel.textContent = remaining + '초 후 이동...';

        var countdownInterval = setInterval(function() {
          remaining--;
          if (remaining > 0) {
            document.getElementById('step6Text').textContent = remaining + '초 후 분석 페이지로 이동합니다.';
            btnLabel.textContent = remaining + '초 후 이동...';
          } else {
            clearInterval(countdownInterval);
            document.getElementById('step6Text').textContent = '분석 페이지로 이동 중...';
            setStepState(6, 'done');
            btnLabel.textContent = '이동 중...';
            window.location.href = 'analyzing_tool.html?email=' + encodeURIComponent(email);
          }
        }, 1000);

      } catch (err) {
        setStepState(1, 'error');
        msg.style.color = '#d9534f';
        msg.textContent = '서버 연결에 실패했습니다.';
        btnLabel.textContent = 'Login';
        btnWrap.classList.remove('disabled');
        setProgress(0);
        isProcessing = false;
        console.error(err);
      }
    }

    function resetSteps() {
      for (var i = 1; i <= 6; i++) { setStepState(i, 'wait'); }
      document.getElementById('step6Text').textContent = '분석 페이지로 이동 중...';
    }

    // 페이지 로드 시 입력란 초기화
    window.addEventListener('load', function() {
      document.getElementById('email').value = '';
      document.getElementById('password').value = '';
    });

    // Enter 키로 로그인
    document.getElementById('password').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') handleLogin();
    });
  </script>
</body>
</html>
