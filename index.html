<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REA LAB.</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #9e9e9e;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .login-container {
      background: #ffffff;
      border-radius: 12px;
      padding: 40px 36px 36px;
      width: 320px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      text-align: center;
    }

    .login-container h1 {
      font-size: 22px;
      font-weight: 700;
      color: #333;
      margin-bottom: 28px;
      letter-spacing: 1px;
    }

    .login-container input {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 14px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      background-color: #eef2f7;
      color: #555;
      outline: none;
      transition: border-color 0.2s;
    }

    .login-container input:focus {
      border-color: #5b9bd5;
    }

    .login-container input::placeholder {
      color: #999;
    }

    .btn-login {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      background-color: #4a7cdf;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-login:hover {
      background-color: #3a65c0;
    }

    .btn-login:disabled {
      background-color: #a0b4d9;
      cursor: not-allowed;
    }

    .message {
      margin-top: 14px;
      font-size: 13px;
      color: #d9534f;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h1>REA LAB.</h1>
    <!-- 브라우저 자동완성 트랩 (숨김 필드) -->
    <input type="text" name="fake_user" style="display:none" aria-hidden="true" />
    <input type="password" name="fake_pass" style="display:none" aria-hidden="true" />
    <input type="text" id="email" placeholder="E-mail" autocomplete="new-password" />
    <input type="password" id="password" placeholder="Password" autocomplete="new-password" />
    <button class="btn-login" id="loginBtn" onclick="handleLogin()">Login</button>
    <div class="message" id="msg"></div>
  </div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbyp-bsk9zVmknsYf4ZKcHyyW8u8atb1CVLcLzv_MqdxzEY8PY_CDy4jt-cb8SyLiudI/exec';

    async function handleLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const msg = document.getElementById('msg');
      const btn = document.getElementById('loginBtn');

      if (!email || !password) {
        msg.textContent = '이메일과 비밀번호를 입력해주세요.';
        return;
      }

      msg.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Logging in...';

      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ email, password })
        });

        const result = await response.json();

        if (result.success) {
          msg.style.color = '#5cb85c';
          msg.textContent = '로그인 성공!';
          setTimeout(() => {
            window.location.href = 'analyzing_tool.html';
          }, 500);
        } else {
          msg.style.color = '#d9534f';
          msg.textContent = result.message || '이메일 또는 비밀번호가 올바르지 않습니다.';
        }
      } catch (err) {
        msg.style.color = '#d9534f';
        msg.textContent = '서버 연결에 실패했습니다.';
        console.error(err);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Login';
      }
    }

    // 페이지 로드 시 입력란 초기화
    window.addEventListener('load', function() {
      document.getElementById('email').value = '';
      document.getElementById('password').value = '';
    });

    // Enter 키로 로그인
    document.getElementById('password').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') handleLogin();
    });
  </script>
</body>
</html>
